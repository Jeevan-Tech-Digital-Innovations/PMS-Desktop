[package]
name = "pms-desktop"
version = "2.0.0"
description = "PMS Desktop: time tracking agent"
authors = ["Jeevan Tech Digital Innovations"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads the app identifier (after `--config` overlays) so the keychain service follows the channel.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Linux: Secret Service over D-Bus (GNOME Keyring / KWallet), sync API, pure-Rust session crypto.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
active-win-pos-rs = "0.11"
hostname = "0.4"
dirs = "6"
fastrand = "2"
log = "0.4"
iana-time-zone = "0.1"

[target.'cfg(unix)'.dependencies]
# SIGTERM (log-out, `kill`) stops the timer before the process ends.
tokio = { version = "1", features = ["signal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Screenshots on Windows (and macOS for development). Linux captures X11 directly (tracker/linux.rs): xcap pulls in
# PipeWire bindings that need a newer PipeWire than Ubuntu 22.04 ships.
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Idle time (GNOME Mutter IdleMonitor) and screen lock (GNOME ScreenSaver, systemd-logind). Same libdbus
# binding tao and keyring already use on Linux.
dbus = "0.9"
# Idle time on X11 via the XScreenSaver extension; pure-Rust connection, no extra system library.
x11rb = { version = "0.14", features = ["screensaver"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_StationsAndDesktops"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
